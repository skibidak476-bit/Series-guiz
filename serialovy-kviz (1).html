<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seriálový kvíz</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1b1d2a;--mut:#6b7085;--bd:#dfe2ee;--ac:#5b5bf0;--ok:#1f9d55;--ko:#d93a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12131c;--card:#1d1f2e;--tx:#eef0fa;--mut:#9aa0b8;--bd:#32354a;--ac:#8080ff;--ok:#3ecf7b;--ko:#ff6b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12131c;--card:#1d1f2e;--tx:#eef0fa;--mut:#9aa0b8;--bd:#32354a;--ac:#8080ff;--ok:#3ecf7b;--ko:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:24px 16px}
h1{text-align:center;margin:8px 0 4px;font-size:2rem}
.sub{text-align:center;color:var(--mut);margin:0 0 24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.show{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:20px 10px;text-align:center;cursor:pointer;font:inherit;color:inherit;transition:transform .15s,border-color .15s}
.show:hover{transform:translateY(-3px);border-color:var(--c)}
.show .e{font-size:2.6rem;display:block}
.show b{display:block;margin-top:6px;font-size:1.1rem}
.show small{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:.9rem;margin-bottom:10px}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.pts{display:inline-block;background:var(--ac);color:#fff;border-radius:20px;padding:2px 12px;font-weight:700;font-size:.85rem}
.q{font-size:1.25rem;font-weight:600;margin:10px 0 18px;line-height:1.35}
.ans{display:block;width:100%;text-align:left;margin:8px 0;padding:14px 16px;border-radius:12px;border:2px solid var(--bd);background:transparent;color:inherit;font:inherit;cursor:pointer}
.ans:hover:not(:disabled){border-color:var(--ac)}
.ans.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}
.ans.ko{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 18%,transparent)}
.btn{display:block;width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn.sec{background:transparent;color:var(--tx);border:2px solid var(--bd)}
.big{font-size:4rem;font-weight:800;text-align:center;margin:6px 0;color:var(--ac)}
.c{text-align:center}
.hide{display:none}
body{background:radial-gradient(circle at 15% 0%,color-mix(in srgb,var(--sc,#5b5bf0) 38%,transparent),transparent 55%),radial-gradient(circle at 95% 100%,color-mix(in srgb,var(--sc,#5b5bf0) 26%,transparent),transparent 50%),var(--bg);background-attachment:fixed;transition:background .4s}
h1{font-size:2.5rem;background:linear-gradient(90deg,#f5c518,#2bb7e8,#7bc043,#e8743b);-webkit-background-clip:text;background-clip:text;color:transparent}
.show{border-top:6px solid var(--c);box-shadow:0 6px 18px rgba(0,0,0,.12)}
.show:hover{transform:translateY(-5px) rotate(-1deg);box-shadow:0 12px 26px color-mix(in srgb,var(--c) 45%,transparent)}
.show .e{font-size:3.4rem;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.card{box-shadow:0 10px 30px rgba(0,0,0,.18);animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.bar{height:10px}.bar i{background:linear-gradient(90deg,var(--sc,var(--ac)),var(--ac))}
.tag{margin-left:8px;color:var(--mut);font-size:.85rem;font-weight:600}
.clue{font-size:4rem;text-align:center;margin:10px 0;letter-spacing:8px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.desc{background:color-mix(in srgb,var(--sc,#5b5bf0) 15%,transparent);border-left:4px solid var(--sc,#5b5bf0);padding:10px 14px;border-radius:8px;margin-bottom:14px;line-height:1.4}
.inp{width:100%;padding:14px;border-radius:12px;border:2px solid var(--bd);background:transparent;color:inherit;font:inherit;font-size:1.1rem}
.inp:focus{outline:none;border-color:var(--ac)}.inp.ok{border-color:var(--ok)}.inp.ko{border-color:var(--ko)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{margin-top:12px;font-weight:600}
.ans{transition:transform .1s,border-color .15s}.ans:active{transform:scale(.98)}
.big{font-size:5rem}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
main{position:relative;z-index:1}
#run{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#run:after{content:"";position:absolute;left:0;right:0;bottom:0;height:14vh;background:linear-gradient(transparent,color-mix(in srgb,var(--ac) 25%,transparent))}
.rn{position:absolute;left:0;will-change:transform;animation:go linear infinite;filter:drop-shadow(0 5px 4px rgba(0,0,0,.25));opacity:.9}
.rn.l{animation-name:gol}
.rn span{display:block;animation:hop .4s ease-in-out infinite alternate}
@keyframes go{from{transform:translateX(-15vw)}to{transform:translateX(115vw)}}
@keyframes gol{from{transform:translateX(115vw)}to{transform:translateX(-15vw)}}
@keyframes hop{from{transform:translateY(0) rotate(-7deg)}to{transform:translateY(-16px) rotate(7deg)}}
.lg{transform-box:fill-box;transform-origin:50% 0;animation:leg .3s ease-in-out infinite alternate}
.lg.b{animation-direction:alternate-reverse}
@keyframes leg{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
.wag{transform-box:fill-box;transform-origin:0 50%;animation:wag .5s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-9deg)}to{transform:rotate(12deg)}}
.bl{transform-box:fill-box;transform-origin:center;animation:bl 4.5s infinite}
@keyframes bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.pl{transform-box:fill-box;transform-origin:center;animation:pl .8s ease-in-out infinite alternate}
@keyframes pl{from{transform:scale(.8);opacity:.65}to{transform:scale(1.15);opacity:1}}
.sp{transform-box:fill-box;transform-origin:center;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.bob{animation:bob .5s ease-in-out infinite alternate}.bob.b{animation-delay:-.25s}
@keyframes bob{to{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.rn,.rn span,.lg,.wag,.bl,.pl,.sp,.bob{animation:none}}
</style>
</head>
<body>
<div id="run" aria-hidden="true"></div>
<main>
<section id="home">

  <div class="grid" id="grid"></div>
</section>
<section id="quiz" class="hide"></section>
<section id="res" class="hide card"></section>
</main>
<script>

const $=id=>document.getElementById(id);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let key,qs,i,score,total,done;

$("grid").innerHTML=Object.entries(D).map(([k,s])=>`<button class="show" style="--c:${s.c}" data-k="${k}"><span class="e">${s.e}</span><b>${s.n}</b><small>${s.q.length} otázek v bance</small></button>`).join("");
$("grid").onclick=e=>{const b=e.target.closest(".show");if(b)start(b.dataset.k)};

function show(id){["home","quiz","res"].forEach(x=>$(x).classList.toggle("hide",x!==id))}

function start(k){
  key=k;
  qs=shuf(D[k].q).slice(0,10).map(r=>({p:r[0],t:r[1],c:r[2],a:shuf(r.slice(2))}));
  total=qs.reduce((s,q)=>s+q.p,0);score=0;i=0;
  show("quiz");ask();
}

function ask(){
  done=false;const q=qs[i];
  $("quiz").innerHTML=`<div class="card">
    <div class="top"><span>${D[key].e} ${D[key].n} · otázka ${i+1}/10</span><span>Body: ${score}</span></div>
    <div class="bar"><i style="width:${i*10}%"></i></div>
    <span class="pts">${q.p} ${q.p<5?"body":"bodů"}</span>
    <div class="q">${q.t}</div>
    <div id="ans">${q.a.map((a,n)=>`<button class="ans" data-n="${n}">${a}</button>`).join("")}</div>
    <button class="btn hide" id="next">${i<9?"Další otázka →":"Zobrazit výsledek"}</button>
  </div>`;
  $("ans").onclick=pick;
  $("next").onclick=()=>{i++;i<10?ask():finish()};
}

function pick(e){
  const b=e.target.closest(".ans");if(!b||done)return;
  done=true;const q=qs[i];
  [...document.querySelectorAll(".ans")].forEach(x=>{
    x.disabled=true;
    if(x.textContent===q.c)x.classList.add("ok");
  });
  if(b.textContent===q.c)score+=q.p;else b.classList.add("ko");
  $("next").classList.remove("hide");
}

function finish(){
  const pct=Math.round(score/total*100);
  const msg=pct>=90?"Absolutní mistr! 🏆":pct>=70?"Skvělý fanoušek! 🎉":pct>=50?"Dobrá práce, ale ještě je co objevovat. 📺":pct>=30?"Chce to víc koukat! 🍿":"Čas na maraton seriálu! 😅";
  $("res").innerHTML=`<div class="c"><div>${D[key].e} ${D[key].n}</div>
    <div class="big">${pct} %</div>
    <p>Získal jsi <b>${score}</b> z <b>${total}</b> možných bodů.</p>
    <p>${msg}</p></div>
    <button class="btn" id="again">Zkusit znovu</button>
    <button class="btn sec" id="menu">Vybrat jiný seriál</button>`;
  show("res");
  $("again").onclick=()=>start(key);
  $("menu").onclick=()=>show("home");
}
</script>

const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const root=document.documentElement;
const oldShow=show;
show=function(id){if(id==="home")root.style.removeProperty("--sc");oldShow(id)};

start=function(k){
  key=k;root.style.setProperty("--sc",D[k].c);const s=D[k];
  const mk=(r,t)=>t==="q"?{k:"q",p:r[0],t:r[1],c:r[2],a:shuf(r.slice(2))}:t==="w"?{k:"w",p:r[0],e:r[1],d:r[2],c:r[3],a:shuf(r.slice(3))}:{k:"t",p:r[0],e:r[1],d:r[2],c:r[3],al:[r[3],...r[4]]};
  qs=shuf([...shuf(s.q).slice(0,5).map(r=>mk(r,"q")),...shuf(s.w).slice(0,3).map(r=>mk(r,"w")),...shuf(s.t).slice(0,2).map(r=>mk(r,"t"))]);
  total=qs.reduce((a,q)=>a+q.p,0);score=0;i=0;show("quiz");ask();
};

ask=function(){
  done=false;const q=qs[i];
  const lab={q:"Kvízová otázka",w:"Co je tohle za postavu?",t:"✍️ Napiš jméno postavy"}[q.k];
  const col=q.p>=6?"#d93a3a":q.p>=4?"#e8a317":"#1f9d55";
  $("quiz").innerHTML=`<div class="card">
    <div class="top"><span>${D[key].e} ${D[key].n} · ${i+1}/10</span><span>⭐ ${score}</span></div>
    <div class="bar"><i style="width:${i*10}%"></i></div>
    <span class="pts" style="background:${col}">${q.p} b.</span><span class="tag">${lab}</span>
    ${q.e?`<div class="clue">${q.e}</div><div class="desc">${q.d}</div>`:`<div class="q">${q.t}</div>`}
    ${q.k==="t"?`<input class="inp" id="inp" placeholder="Napiš jméno…" autocomplete="off"><button class="btn" id="ok">Odpovědět</button>`:`<div id="ans">${q.a.map(a=>`<button class="ans">${a}</button>`).join("")}</div>`}
    <div class="fb" id="fb"></div>
    <button class="btn hide" id="next">${i<9?"Další otázka →":"Zobrazit výsledek"}</button></div>`;
  $("next").onclick=()=>{i++;i<10?ask():finish()};
  if(q.k==="t"){$("ok").onclick=check;$("inp").onkeydown=e=>{if(e.key==="Enter")check()};$("inp").focus()}
  else $("ans").onclick=pick;
};

pick=function(e){
  const b=e.target.closest(".ans");if(!b||done)return;
  done=true;const q=qs[i],good=b.textContent===q.c;
  document.querySelectorAll(".ans").forEach(x=>{x.disabled=true;if(x.textContent===q.c)x.classList.add("ok")});
  if(good)score+=q.p;else b.classList.add("ko","shake");
  $("fb").textContent=good?"✅ Správně! +"+q.p:"❌ Špatně";
  $("next").classList.remove("hide");
};

function check(){
  const q=qs[i],inp=$("inp"),v=norm(inp.value);
  if(done||!v)return;
  done=true;const good=q.al.some(a=>norm(a)===v);
  inp.disabled=true;inp.classList.add(good?"ok":"ko");
  if(good)score+=q.p;else inp.classList.add("shake");
  $("fb").textContent=good?"✅ Správně! +"+q.p:"❌ Správná odpověď: "+q.c;
  $("ok").classList.add("hide");$("next").classList.remove("hide");
}

function confetti(){for(let n=0;n<45;n++){const c=document.createElement("i");c.className="cf";c.style.cssText=`left:${Math.random()*100}vw;background:hsl(${Math.random()*360},85%,60%);animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()}s`;document.body.appendChild(c);setTimeout(()=>c.remove(),5000)}}
const oldFinish=finish;
finish=function(){oldFinish();if(Math.round(score/total*100)>=70)confetti()};
